<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>Illustrations du jeu</title>
		<style>
			body {
				margin: 24px;
				background: #140c07;
				color: #e8dccb;
				font-family: system-ui, sans-serif;
			}
			main {
				display: flex;
				flex-wrap: wrap;
				gap: 24px;
			}
			figure {
				margin: 0;
				text-align: center;
			}
			img {
				display: block;
				width: 336px;
				image-rendering: pixelated;
			}
			h2 {
				font-size: 16px;
				font-weight: 600;
			}
			a {
				color: #ffb060;
			}
		</style>
	</head>
	<body>
		<p id="status">Rendu en cours…</p>
		<h2>Choix du mode : src/features/home/art/</h2>
		<main id="modes"></main>
		<h2>Présence Discord : src/features/discord/art/</h2>
		<main id="presence"></main>
		<script type="module">
			import { drawModeArt, drawPresenceArt } from "/src/features/home/modeArt.ts";

			const status = document.getElementById("status");

			function show(target, art) {
				for (const [name, url] of Object.entries(art)) {
					const figure = document.createElement("figure");
					const image = document.createElement("img");
					image.src = url;
					image.alt = name;
					const link = document.createElement("a");
					link.href = url;
					link.download = `${name}.png`;
					link.textContent = `${name}.png`;
					const caption = document.createElement("figcaption");
					caption.append(link);
					figure.append(image, caption);
					document.getElementById(target).append(figure);
				}
			}

			try {
				show("modes", await drawModeArt());
				show("presence", await drawPresenceArt());
				status.textContent =
					"Téléchargez les images et remplacez celles des dossiers indiqués.";
			} catch (error) {
				status.textContent = `Échec : ${error}`;
				throw error;
			}
		</script>
	</body>
</html>
