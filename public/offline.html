<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111512" />
    <title>MOLDIUS</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #111512;
        color: #ecefe2;
        font-family: "Arial Narrow", "Roboto Condensed", sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 24px;
        color: #dce54d;
        font-size: clamp(48px, 9vw, 96px);
        letter-spacing: 0.02em;
        text-shadow: 4px 4px 0 #2f3a31;
      }
      p {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p[lang="en"] {
        color: #9fa894;
      }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 32px;
        background: #dce54d;
        color: #111512;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:hover,
      a:focus-visible {
        background: #eef46a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MOLDIUS</h1>
      <p>Le serveur du jeu est injoignable. Vérifiez votre connexion.</p>
      <p lang="en">The game server is unreachable. Check your connection.</p>
      <a href="/">Réessayer · Retry</a>
    </main>
  </body>
</html>
